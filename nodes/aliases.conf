# nodes/aliases.conf — legacy alias resolution (shell-sourceable lists).
# Format: ALIAS=<target or selector spec>
# AGENT_BOX resolves to AGENT_NODE (NODE_CATALOG.md section E).
# LAB_HOST is an interactive selector among the lab node types;
# non-interactive use must pass the exact type (SPECIFICATION.md section 4).
ALIASES="AGENT_BOX LAB_HOST"
AGENT_BOX_TARGET=AGENT_NODE
LAB_HOST_CHOICES="MALWARE_NODE RE_NODE PENTEST_NODE RANGE_NODE FORENSICS_NODE"
